function icon(name){return `<span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24">${ICONS[name]||ICONS.sparkles}</svg></span>`}
function htmlSafe(value){return String(value==null?'':value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function button(href,label,kind='primary',extra=''){return `<a class="btn btn-${kind}" href="${href}" ${extra}>${label}</a>`}
function pill(text){return `<span class="pill"><span class="dot"></span>${text}</span>`}
function sectionHeading(eyebrow,title,sub='',center=false){return `<div class="section-intro ${center?'center':''}"><div class="eyebrow"><span class="small-dot"></span>${eyebrow}</div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>`}
function previewBanner(){return `<div class="info-banner">${icon('info')}<div><strong>Prévia de interface.</strong> Esta versão é apenas o front-end em HTML. Dados financeiros, clientes, login, integrações e permissões privadas dependem de um back-end seguro. Nenhum pagamento ou ativação é realizado aqui.</div></div>`}
function featureCard(iconName,title,copy){return `<article class="card hover"><div class="card-icon">${icon(iconName)}</div><h3>${title}</h3><p>${copy}</p></article>`}
function faqMarkup(items=FAQ){return `<div class="faq-list">${items.map(([q,a])=>`<details class="faq"><summary>${htmlSafe(q)}${icon('chevron')}</summary><p>${htmlSafe(a)}</p></details>`).join('')}</div>`}

function how(){const steps=[['Escolha seu plano','Compare as opções Start, Pro e Business, incluindo limites e condições quando publicados.','chart'],['Cadastre sua empresa','Crie sua conta e forneça os dados comerciais necessários com segurança após integração.','building'],['Configure o atendimento','Informe produtos, serviços, horários, regras, preferências de linguagem e dados úteis.','sliders'],['Faça a integração','Conecte o número por mecanismo aprovado pela Meta, valide o atendimento e acompanhe a ativação.','message']];return `${pageHero('Como funciona','Da primeira conversa à operação do seu agente.','Um processo pensado para facilitar a contratação e deixar cada etapa de ativação clara.')}<section class="section"><div class="container"><div class="grid grid-2">${steps.map(([name,desc,ic],idx)=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:start"><div class="card-icon">${icon(ic)}</div><span class="tag tag-neutral">Etapa ${idx+1} de 4</span></div><h3>${name}</h3><p style="font-size:14px">${desc}</p></div>`).join('')}</div><div class="info-banner" style="margin-top:28px">${icon('info')}<div>O site comercial gerenciará a contratação. A inteligência artificial e sua conexão real com o WhatsApp serão operadas por um sistema externo, a ser integrado.</div></div></div></section><section class="section section-wash"><div class="container">${sectionHeading('Acompanhamento','Você sabe em qual etapa está.','A futura área do cliente exibirá o status real da ativação, sem marcar processos como concluídos antes da confirmação.')}<div class="feature-row"><div class="glass-box"><div class="timeline">${['Informações pendentes','Configuração em andamento','Aguardando integração','Em testes','Ativo','Necessita atenção'].map((s,i)=>`<div>${icon(i===0?'info':'clock')}<span>${s}</span><span style="margin-left:auto;font-size:11px">${i===0?'Inicial':'Etapa prevista'}</span></div>`).join('')}</div></div><div><h2>Visibilidade sem complicação let solutionFilter='todos';
function solutions(){return `${pageHero('Soluções','Inteligência para diferentes tipos de negócio.','Conheça possibilidades de atendimento para vários segmentos, sem limitar sua empresa a uma categoria.')}<div class="container page-body"><div class="filters" id="solution-filters">${[['todos','Todos'],['servicos','Serviços'],['comercio','Comércio'],['saude','Saúde'],['alimentacao','Alimentação'],['educacao','Educação']].map(([id,t])=>`<button data-filter="${id}" class="filter-btn ${solutionFilter===id?'active':''}">${t}</button>`).join('')}</div><div class="grid grid-3" id="solution-list" style="margin-top:30px">${INDUSTRIES.filter(x=>solutionFilter==='todos'||x.category===solutionFilter||x.category==='outros'&&solutionFilter==='todos').map(ind=>`<article class="card hover"><div class="card-icon">${icon(ind.icon)}</div><h3>${ind.name}</h3><p>${ind.problem}</p><a class="inline-link" href="#/demonstracao?segmento=${ind.id}">Simular conversa ${icon('arrow')}</a></article>`).join('')}</div><div class="info-banner" style="margin-top:28px">${icon('info')}<div>Exemplos de uso, não comprovação de funcionalidades ativas. Empresas de qualquer segmento poderão solicitar avaliação e configuração.</div></div></div>`}
function readPrices(){try{const raw=JSON.parse(localStorage.getItem('nuvia_plan_preview_v1')||'{}');return Object.fromEntries(Object.entries(raw).filter(([k,v])=>PLANS.some(p=>p.id===k)&&typeof v==='number'&&Number.isFinite(v)&&v>0&&v<1000000))}catch(_){return {}}}
function fmtPrice(value){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(value)}
function pricingCards(){const prices=readPrices();return `<div class="grid grid-3 pricing-grid">${PLANS.map(plan=>`<article class="price-card ${plan.popular?'popular':''}">${plan.popular?'<div class="popular-label">Em destaque</div>':''}<div class="section-label">Plano ${plan.name}</div><h3>${plan.name}</h3><p class="audience">${plan.audience}</p>${prices[plan.id]?`<span class="price">${fmtPrice(prices[plan.id])} <small>/ mês</small></span><p class="price-desc">Valor apenas desta prévia local; não publicado.</p>`:`<span class="price price-pending">Preço a definir</span><p class="price-desc">Valores mensais ainda não publicados.</p>`}${button(`#/contratacao?plano=${plan.id}`,'Solicitar contratação','primary')}<ul class="price-list">${plan.items.map(t=>`<li>${icon('check')}<span>${t}</span></li>`).join('')}</ul><div class="price-footer">${plan.usage}<br>${plan.support}</div></article>`).join('')}</div>`}
function pricing(){return `${pageHero('Planos e preços','Encontre o plano certo para o seu negócio.','Três propostas para diferentes necessidades. Preços oficiais, limites e condições comerciais serão divulgados antes de habilitar contratações.')}<section class="section"><div class="container">${pricingCards()}<div class="info-banner" style="margin-top:24px">${icon('info')}<div><strong>Contratações ainda não habilitadas.</strong> Este HTML não realiza cobranças nem ativa assinaturas. Qualquer preço alterado na prévia administrativa vale apenas para este navegador e não é um valor comercial oficial.</div></div><div style="margin-top:66px">${sectionHeading('Comparativo','Compare o que está previsto em cada plano.','As diferenças e limites finais serão confirmados quando a oferta comercial estiver definida.')}${comparisonTable()}</div><div class="glass-box" style="margin-top:40px;display:flex;align-items:center;justify-content:space-between;gap:25px;flex-wrap:wrap"><div><h3>Precisa de algo específico?</h3><p style="font-size:13px;margin-top:6px">Explique sua necessidade e prepare uma solicitação de contato.</p></div>${button('#/contato',`Solicitar informações ${icon('arrow')}`)}</div></div></section>`}
function comparisonTable(){const features=[['Respostas a dúvidas','Previsto','Previsto','Previsto'],['Informações comerciais','Previsto','Previsto','Previsto'],['Apoio a vendas','A definir','Previsto','Previsto'],['Agendamentos','A definir','Previsto','Previsto'],['Personalização avançada','A definir','Previsto','Previsto'],['Integrações avançadas','A definir','A definir','Sob avaliação'],['Número de WhatsApps','A definir','A definir','A definir'],['Limites de uso','A definir','A definir','A definir'],['Suporte','A definir','A definir','A definir']];return `<div class="table-wrap"><table><thead><tr><th>Recurso</th><th>Start</th><th>Pro</th><th>Business</th></tr></thead><tbody>${features.map(r=>`<tr>${r.map(t=>`<td>${t}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="compare-note">"Previsto" indica planejamento, não disponibilidade confirmada.</p>`}
const DEMO_CONTEXTS={
 beleza:{name:'Salão de beleza',service:'corte, escova e hidratação',example:'Vocês fazem escova?'},barbearia:{name:'Barbearia',service:'corte de cabelo e barba',example:'Quais serviços vocês têm?'},clinica:{name:'Clínica',service:'consultas e informações administrativas',example:'Como faço para agendar?'},odonto:{name:'Consultório odontológico',service:'consultas odontológicas',example:'Quero marcar uma avaliação'},restaurante:{name:'Restaurante',service:'refeições e informações sobre cardápio',example:'Qual é o cardápio?'},lanchonete:{name:'Lanchonete',service:'lanches e bebidas',example:'Tem opção vegetariana?'},moda:{name:'Loja de roupas',service:'roupas e acessórios',example:'Quero saber sobre tamanhos'},ecommerce:{name:'Loja virtual',service:'produtos online e orientações sobre pedidos',example:'Como funciona a entrega?'},imobiliaria:{name:'Imobiliária',service:'imóveis e agendamento de visitas',example:'Quero visitar um imóvel'},academia:{name:'Academia',service:'planos e modalidades',example:'Quais planos vocês têm?'},oficina:{name:'Oficina',service:'serviços automotivos e orçamentos',example:'Como pedir orçamento?'},escola:{name:'Escola',service:'cursos, matrículas e horários',example:'Como faço a matrícula?'},prestador:{name:'Prestador de serviços',service:'orçamentos e prestação de serviços',example:'Quero um orçamento'},outros:{name:'Empresa',service:'produtos e serviços',example:'Quais serviços vocês oferecem?'}
};
let demoSegment='beleza';let demoMessages=[];
function initDemo(segment){demoSegment=DEMO_CONTEXTS[segment]?segment:'beleza';demoMessages=[{role:'agent',text:`Olá! 👋 Bem-vindo(a) à demonstração de ${DEMO_CONTEXTS[demoSegment].name}. Sou um assistente demonstrativo. Como posso ajudar?`}];}
function demoReply(text){const q=text.toLocaleLowerCase('pt-BR');const context=DEMO_CONTEXTS[demoSegment];if(/(pre[çc]o|valor|quanto|custa|promo|mensalidade)/i.test(q))return `Posso ajudar com informações sobre valores. Nesta simulação não há preços reais cadastrados. Em uma implementação ativa, eu consultaria a tabela de preços da ${context.name} antes de responder.`;if(/(hor[aá]rio|abr[ei]|funciona|fecha|aberto|dias)/i.test(q))return `Consigo orientar sobre os horários de funcionamento. Aqui usamos somente respostas de exemplo; os horários reais seriam configurados pela ${context.name}.`;if(/(agend|marc|reserva|visita|consulta)/i.test(q))return `Claro! Posso ajudar com uma solicitação de horário. Na versão real, eu precisaria consultar a agenda conectada antes de confirmar qualquer disponibilidade.`;if(/(servi[çc]|faz|card[aá]pio|produto|vende|op[çc]|tem )/i.test(q))return `Podemos apresentar informações sobre ${context.service}. Os detalhes de serviços, estoque e condições seriam fornecidos pela empresa após a configuração.`;if(/(humano|pessoa|atendente|funcion[aá]rio)/i.test(q))return `Entendi! Em uma operação real, o atendimento poderia ser encaminhado para uma pessoa da equipe, conforme as regras configuradas.`;if(/(oi|ol[aá]|bom dia|boa tarde|boa noite)/i.test(q))return `Olá! 😊 Posso apresentar informações sobre ${context.service}, explicar como solicitar horários ou orientar sobre atendimento.`;return `Obrigado pela mensagem! Esta é uma simulação com respostas programadas, não uma IA real. Em um agente integrado, a resposta dependeria das informações da ${context.name} e das regras do atendimento.`;}
function demo(){return `${pageHero('Demonstração','Experimente como uma conversa pode funcionar.','Escolha um tipo de empresa e interaja com uma simulação de atendimento.')}<div class="container page-body"><div class="info-banner" style="margin-bottom:26px">${icon('info')}<div><strong>Simulação, sem inteligência artificial real.</strong> As respostas abaixo são programadas para mostrar a experiência visual. Não há conexão com WhatsApp, consulta de agenda, banco de dados ou atendimento ativo.</div></div><div class="demo-layout"><aside class="demo-config"><h3>Configure a demonstração</h3><p>Selecione o tipo de negócio e teste perguntas comuns.</p><div class="field"><label for="demo-sector">Segmento da empresa</label><select id="demo-sector">${INDUSTRIES.map(ind=>`<option value="${ind.id}" ${ind.id===demoSegment?'selected':''}>${ind.name}</option>`).join('')}</select></div><h4 style="font-size:13px;margin-top:23px">Experimente perguntar</h4><div class="suggestion-buttons"><button data-suggest="${htmlSafe(DEMO_CONTEXTS[demoSegment].example)}">${htmlSafe(DEMO_CONTEXTS[demoSegment].example)}</button><button data-suggest="Quais são os horários de funcionamento?">Quais são os horários de funcionamento?</button><button data-suggest="Quero falar com um atendente">Quero falar com um atendente</button></div><button class="btn btn-secondary" data-reset-demo>${icon('refresh')} Reiniciar conversa</button></aside><div class="demo-chat"><div class="demo-chat-header"><div class="avatar">${icon('sparkles')}</div><div><strong>Agente demonstrativo</strong><small>${htmlSafe(DEMO_CONTEXTS[demoSegment].name)}</small></div><span class="tag">Simulação</span></div><div class="demo-messages" id="demo-messages" aria-live="polite"></div><form class="demo-form" id="demo-form"><input id="demo-input" aria-label="Mensagem para demonstração" placeholder="Digite sua mensagem de teste..." maxlength="350" required autocomplete="off"/><button class="btn btn-primary" type="submit">${icon('send')}<span class="desktop-send-label">Enviar</span></button></form></div></div><div style="display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin-top:36px"><span class="small muted">Gostou do conceito da experiência?</span>${button('#/planos',`Conhecer os planos ${icon('arrow')}`)}</div></div>`}
function renderDemoMessages(){const target=document.getElementById('demo-messages');if(!target)return;target.innerHTML=demoMessages.map(m=>`<div class="demo-message ${m.role}">${htmlSafe(m.text)}</div>`).join('');target.scrollTop=target.scrollHeight;}
function sendDemo(text){const safe=String(text||'').trim().slice(0,350);if(!safe)return;demoMessages.push({role:'user',text:safe},{role:'agent',text:demoReply(safe)});renderDemoMessages();const input=document.getElementById('demo-input');if(input){input.value='';input.focus();}}
function auth(kind){const isRegister=kind==='cadastro';return `<div class="container auth-layout"><div class="auth-form"><span class="eyebrow">${isRegister?'Primeiro acesso':'Área de acesso'}</span><h1>${isRegister?'Crie sua conta':'Bem-vindo de volta'}</h1><p class="sub">${isRegister?'Cadastre sua empresa para começar o processo de contratação.':'Entre para acompanhar a assinatura e a configuração do serviço.'}</p><div class="info-banner">${icon('lock')}<div>Interface de ${isRegister?'cadastro':'login'} preparada. A autenticação real ainda depende de API e banco de dados; nenhuma senha é armazenada por esta versão.</div></div><form id="${isRegister?'register-form':'login-form'}" class="stack-18">${isRegister?`<div class="form-grid"><div class="field full"><label for="register-name">Nome completo</label><input type="text" id="register-name" required minlength="3" autocomplete="name" placeholder="Seu nome completo"/></div><div class="field full"><label for="register-company">Nome da empresa</label><input type="text" id="register-company" required minlength="2" autocomplete="organization" placeholder="Nome do seu negócio"/></div><div class="field full"><label for="register-phone">Telefone de contato</label><input type="tel" id="register-phone" required minlength="8" autocomplete="tel" placeholder="(11) 99999-9999"/></div></div>`:''}<div class="field"><label for="auth-email">E-mail</label><input id="auth-email" type="email" required autocomplete="email" placeholder="nome@empresa.com.br"/></div><div class="field"><label for="auth-password">Senha</label><input id="auth-password" type="password" autocomplete="${isRegister?'new-password':'current-password'}" minlength="8" required placeholder="${isRegister?'Mínimo de 8 caracteres':'Sua senha'}"/></div>${isRegister?`<div class="field"><label for="auth-confirm">Confirme sua senha</label><input id="auth-confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Repita sua senha"/></div>`:`<div style="text-align:right"><a href="#/recuperar-senha" class="inline-link" style="margin-top:0">Esqueci minha senha</a></div>`}<button class="btn btn-primary btn-wide" type="submit">${isRegister?'Validar dados de cadastro':'Verificar acesso'} ${icon('arrow')}</button><p class="small center">${isRegister?'Já tem uma conta?':'Ainda não tem uma conta?'} <a class="blue" style="font-weight:750" href="#/${isRegister?'entrar':'cadastro'}">${isRegister?'Entrar':'Cadastrar-se'}</a></p></form></div><div class="auth-promo"><div class="eyebrow">Pensado para sua empresa</div><h2>Mais controle. Menos complicação.</h2><p>Um espaço para reunir o serviço contratado, acompanhar a ativação e manter as informações do seu negócio organizadas.</p><ul><li>${icon('check')} Informações da assinatura em um só lugar</li><li>${icon('check')} Acompanhamento do processo de ativação</li><li>${icon('check')} Configuração do atendimento orientada</li><li>${icon('check')} Canal de suporte organizado</li></ul></div></div>`}
function recover(){return `${pageHero('Recuperação de senha','Recupere seu acesso.','O fluxo de redefinição de senha será disponibilizado junto à autenticação segura.')}<div class="container page-body"><div class="auth-form" style="max-width:490px;margin:auto"><div class="info-banner">${icon('info')}<div>O envio de e-mails de recuperação depende de um provedor de autenticação e ainda não está ativo.</div></div><form id="recover-form" class="stack-18"><div class="field"><label for="recover-email">Seu e-mail</label><input type="email" id="recover-email" placeholder="nome@empresa.com.br" required/></div><button type="submit" class="btn btn-primary btn-wide">Verificar e-mail</button></form></div></div>`}
function checkout(params){const chosen=PLANS.find(x=>x.id===params.get('plano'))||PLANS[0];const prices=readPrices();return `${pageHero('Contratação','Vamos preparar sua contratação.','Revise o plano selecionado e organize as informações de contato.')}<div class="container page-body"><div class="grid grid-2"><div><div class="glass-box"><div class="section-label">Plano selecionado</div><h2>${chosen.name}</h2><p style="margin-top:13px">${chosen.audience}</p><div class="price" style="margin-top:24px">${prices[chosen.id]?fmtPrice(prices[chosen.id]):'Valor a definir'}</div><p class="small muted">${prices[chosen.id]?'Preço apenas de prévia local; não é oferta oficial.':'Valores e limites devem ser definidos antes de cobrar.'}</p><div class="divider" style="margin:24px 0"></div><h4>Benefícios planejados</h4><ul class="check-list">${chosen.items.map(x=>`<li>${icon('check')}${x}</li>`).join('')}</ul><p class="note" style="margin-top:20px">Não é realizada nenhuma cobrança, assinatura ou reserva nesta versão.</p></div><div style="margin-top:17px">${button('#/planos',`Alterar plano ${icon('arrow')}`,'secondary')}</div></div><div class="glass-box"><div class="eyebrow">Pré-contratação</div><h3>Prepare seu pedido de contato</h3><p style="font-size:13px;margin:11px 0 24px">Preencha os dados e copie o resumo. O site ainda não envia essas informações para um servidor.</p><form id="quote-form" class="form-grid" data-plan="${chosen.id}"><div class="field full"><label for="quote-name">Nome completo</label><input id="quote-name" required minlength="3" placeholder="Seu nome" autocomplete="name"/></div><div class="field full"><label for="quote-company">Empresa</label><input id="quote-company" required placeholder="Nome da empresa" autocomplete="organization"/></div><div class="field full"><label for="quote-email">E-mail</label><input type="email" id="quote-email" required placeholder="nome@empresa.com.br" autocomplete="email"/></div><div class="field full"><label for="quote-phone">Telefone</label><input type="tel" id="quote-phone" required minlength="8" placeholder="(11) 99999-9999" autocomplete="tel"/></div><div class="field full"><button class="btn btn-primary btn-wide" type="submit">${icon('copy')} Copiar solicitação de contratação</button><span class="help">Os dados serão copiados para sua área de transferência. Nada será transmitido ao site.</span></div></form></div></div></div>`}
function client(){const tab=clientTab;const nav=[['visao','Visão geral','home'],['assinatura','Minha assinatura','receipt'],['pagamentos','Pagamentos','credit'],['configuracao','Configuração inicial','sliders'],['ativacao','Status do agente','activity'],['suporte','Suporte','headphones']];let content='';if(tab==='visao'){content=`<h2>Visão geral</h2><p>Informações do serviço quando a conta estiver autenticada.</p><div class="grid grid-3" style="margin:25px 0"><div class="stat-box"><span>Plano contratado</span><strong>—</strong><small>Sem assinatura vinculada</small></div><div class="stat-box"><span>Próxima cobrança</span><strong>—</strong><small>Pagamento não conectado</small></div><div class="stat-box"><span>Agente de IA</span><strong>—</strong><small>Status indisponível</small></div></div>${emptyState('users','Nenhuma conta vinculada','A integração segura com a autenticação e o back-end permitirá carregar os dados reais da sua empresa.')}`}

// Entrada progressiva para seções, cards, formulários, rodapé e painéis de qualquer rota.
let revealObserver=null;
function activateRevealAnimations(){
  if(revealObserver){revealObserver.disconnect();revealObserver=null;}
  const root=document.querySelector('#app .app-root');
  if(!root || !('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const selector=[
    '#main-content .section-intro',
    '#main-content .grid > .card',
    '#main-content .grid > .step-item',
    '#main-content .grid > .price-card',
    '#main-content .grid > .stat-box',
    '#main-content .grid > .sector-card',
    '#main-content .feature-row > *',
    '#main-content .feature-surface',
    '#main-content .callout',
    '#main-content .surface-row',
    '#main-content .faq-list > details',
    '#main-content .demo-layout > *',
    '#main-content .auth-layout > *',
    '#main-content .columns-layout > *',
    '#main-content .content-panel > .grid',
    '#main-content .content-panel > .table-wrap',
    '#main-content .content-panel > .timeline',
    '#main-content .content-panel > .kv',
    '#main-content .content-panel > .empty',
    '#main-content .content-panel > form',
    '#main-content .content-panel > .info-banner',
    '#main-content .content-panel > h2',
    '#main-content .legal-content > h2',
    '#main-content .legal-content > p',
    '#main-content .legal-content > .info-banner',
    '#main-content .page-body > .faq-two',
    '#main-content .page-body > .info-banner',
    '#main-content .form-grid > .field',
    '#main-content .timeline > div',
    '#main-content .kv > div',
    '#main-content .table-wrap',
    '#main-content .filters',
    '#main-content .info-banner',
    '#main-content .glass-box',
    '.footer-grid > *',
    '.footer-bottom'
  ].join(',');
  const elements=[...new Set(root.querySelectorAll(selector))];
  if(!elements.length)return;
  root.classList.add('motion-ready');
  revealObserver=new IntersectionObserver((entries,observer)=>{
    for(const entry of entries){
      if(entry.isIntersecting){
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    }
  },{threshold:.04,rootMargin:'0px 0px -12px 0px'});
  for(const [index,element] of elements.entries()){
    element.classList.add('reveal-item');
    element.style.setProperty('--reveal-delay',`${(index%4)*65}ms`);
    if(element.classList.contains('sidebar') || element.classList.contains('demo-config'))element.dataset.revealSide='left';
    else if(element.classList.contains('content-panel') || element.classList.contains('demo-chat'))element.dataset.revealSide='right';
    revealObserver.observe(element);
  }
}
// Efeito sutil de progresso no alto da tela, com escuta passiva da rolagem.
let nuviaScrollFrame=0;
function updateSiteScroll(){
  if(nuviaScrollFrame)return;
  nuviaScrollFrame=requestAnimationFrame(()=>{
    const max=document.documentElement.scrollHeight-innerHeight;
    const progress=max>0?Math.min(1,Math.max(0,scrollY/max)):0;
    document.documentElement.style.setProperty('--nuvia-scroll-progress',String(progress));
    document.querySelector('.site-header')?.classList.toggle('is-scrolled',scrollY>12);
    nuviaScrollFrame=0;
  });
}

window.addEventListener('hashchange',()=>render());document.addEventListener('click',event=>{const open=event.target.closest('#menu-toggle');if(open){const panel=document.getElementById('mobile-panel');const isOpen=panel.classList.toggle('open');open.setAttribute('aria-expanded',String(isOpen));open.innerHTML=icon(isOpen?'close':'menu');return}const tab=event.target.closest('[data-client-tab]');if(tab){clientTab=tab.dataset.clientTab;render(true);return}const adm=event.target.closest('[data-admin-tab]');if(adm){adminTab=adm.dataset.adminTab;render(true);return}const filt=event.target.closest('[data-filter]');if(filt){solutionFilter=filt.dataset.filter;render(true);document.getElementById('solution-filters')?.scrollIntoView({block:'nearest'});return}const sugg=event.target.closest('[data-suggest]');if(sugg){sendDemo(sugg.dataset.suggest);return}if(event.target.closest('[data-reset-demo]')){initDemo(demoSegment);renderDemoMessages();toast('Conversa de demonstração reiniciada.');return}if(event.target.closest('#close-toast')){document.getElementById('site-toast')?.remove();return}});
document.addEventListener('change',event=>{if(event.target.id==='demo-sector'){initDemo(event.target.value);render(true);}});
document.addEventListener('submit',async event=>{const form=event.target;if(!form.id)return;event.preventDefault();if(!form.reportValidity())return;if(form.id==='demo-form'){sendDemo(document.getElementById('demo-input').value);return}if(form.id==='login-form'||form.id==='register-form'||form.id==='recover-form'){if(form.id==='register-form'&&document.getElementById('auth-password').value!==document.getElementById('auth-confirm').value){toast('As senhas precisam ser iguais.');return}toast('Dados validados apenas no navegador. A autenticação ainda não está conectada; nenhuma conta foi criada ou acessada.');return}if(form.id==='admin-price-form'){const output={};for(const p of PLANS){const raw=document.getElementById('price-'+p.id).value;const value=Number(raw);if(raw.trim()&&value>0&&value<1000000)output[p.id]=value;}try{localStorage.setItem('nuvia_plan_preview_v1',JSON.stringify(output));toast('Preços da prévia salvos neste navegador. Não são valores oficiais.')}catch(_){toast('Não foi possível salvar no armazenamento local deste navegador.')}return}if(form.id==='onboarding-form'){const map={empresa:'onb-company',segmento:'onb-sector',descricao:'onb-description',produtos_e_servicos:'onb-products',horarios:'onb-hours',localizacao:'onb-location',regras:'onb-rules',linguagem:'onb-tone',whatsapp:'onb-whatsapp'};const data=Object.fromEntries(Object.entries(map).map(([key,id])=>[key,document.getElementById(id).value.trim()]));downloadJson(data,'ficha-configuracao-agente.json');toast('Ficha baixada no seu dispositivo. Ela não foi enviada ao serviço.');return}if(form.id==='quote-form'){const selected=PLANS.find(p=>p.id===form.dataset.plan);const msg=`Solicitação de contratação — AtendeAI\nPlano de interesse: ${selected?.name||'Não definido'}\nNome: ${document.getElementById('quote-name').value}\nEmpresa: ${document.getElementById('quote-company').value}\nE-mail: ${document.getElementById('quote-email').value}\nTelefone: ${document.getElementById('quote-phone').value}\nObservação: Solicitação de contato, sem cobrança ou contratação realizada.`;const yes=await copyText(msg);toast(yes?'Solicitação copiada. Nenhuma contratação ou cobrança foi realizada.':'Não foi possível copiar automaticamente. Verifique as permissões do navegador.');return}if(form.id==='contact-form'){const msg=`Solicitação de contato — AtendeAI\nNome: ${document.getElementById('contact-name').value}\nEmpresa: ${document.getElementById('contact-company').value}\nE-mail: ${document.getElementById('contact-email').value}\nMensagem: ${document.getElementById('contact-message').value}`;const yes=await copyText(msg);toast(yes?'Mensagem copiada. Envie-a pelo seu canal de contato; nada foi enviado pelo site.':'Não foi possível copiar automaticamente. Verifique as permissões do navegador.');return}});
if(!location.hash){try{history.replaceState(null,'',location.pathname+location.search+'#/')}catch(_){location.hash='#/'}}initDemo('beleza');render();

</script>
</body>
</html>
